spring.application.name=Api-rojas-remodeling
server.port=${PORT:8081}

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

# ===============================
# JWT SECRETS
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# SUPABASE CONFIGURATION
# ===============================
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# ===============================
# MAIL CONFIGURATION (BREVO)
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=*

# Timeouts de SMTP unificados en 10000ms
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# MULTIPART / FILES CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ASSIGNMENTS & SCHEDULING
spring.task.scheduling.pool.size=3

assignments.enabled=${ASSIGNMENTS_ENABLED:true}
assignments.admin-id=${ASSIGNMENTS_ADMIN_ID:1}
assignments.public-api-url=${ASSIGNMENTS_PUBLIC_API_URL:https://localhost:8081}

assignments.scan-ms=15000
assignments.mail-scan-ms=10000